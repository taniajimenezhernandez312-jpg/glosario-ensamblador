<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glosario Interactivo - Ensamblador</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="forma-decorativa-1"></div>
    <div class="forma-decorativa-2"></div>

    <main class="contenedor">
        <header>
            <h1>Glosario Interactivo: <br> <span>Lenguaje Ensamblador</span></h1>
            <p>Basado en el Estándar <strong>IEEE 610.12</strong></p>
            <div class="caja-busqueda">
                <input type="text" id="buscador" placeholder="Buscar instrucciones (ej. MOV, ADD)...">
            </div>
        </header>

        <section id="lista-terminos" class="cuadricula">
            <article class="tarjeta">
                <h2>MOV</h2>
                <p>Transfiere datos entre registros o memoria.</p>
                <span class="ejemplo">Ejemplo: MOV AX, 01h</span>
            </article>
            <article class="tarjeta">
                <h2>ADD</h2>
                <p>Suma el contenido de dos operandos.</p>
                <span class="ejemplo">Ejemplo: ADD AL, BL</span>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
